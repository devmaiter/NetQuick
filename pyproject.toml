# Tooling configuration only: NetQuick is not a PyPI package,
# it's distributed as an exe (see release.yml).

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
# UP009: keep the "# -*- coding: utf-8 -*-" cookie (harmless on Py3)
ignore = ["UP009"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# The UI (netquick.py) will be included once its fake-based tests cover more paths
include = ["netops.py", "store.py", "winsetup.py", "simops.py", "report.py"]

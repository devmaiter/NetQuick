# Solo configuración de herramientas: NetQuick no es un paquete de PyPI,
# se distribuye como exe (ver release.yml).

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
# UP009: conservar el cookie "# -*- coding: utf-8 -*-" (inofensivo en Py3)
ignore = ["UP009"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# La UI (netquick.py) entrará cuando sus tests con fakes cubran más caminos
include = ["netops.py", "store.py", "winsetup.py"]
